[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zbot-rl-mjlab"
version = "0.1.0"
description = "ZBot six-DOF bipedal walking on mjlab / MuJoCo Warp"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
zbot-mjlab = "zbot_rl_mjlab.cli:main"

[project.entry-points."mjlab.tasks"]
zbot_rl_mjlab = "zbot_rl_mjlab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
